name: Refresh global stats snapshot

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild global stats snapshot
        run: ./scripts/build-global-stats-snapshot.sh

      - name: Validate snapshot JSON
        run: node -e "JSON.parse(require('fs').readFileSync('app/global-stats-snapshot.json','utf8')); console.log('global-stats-snapshot.json ok')"

      - name: Commit refreshed snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh global stats snapshot"
          file_pattern: app/global-stats-snapshot.json
